<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RizzModz Repo</title>
<link rel="icon" href="CydiaIcon.png">
<style>
  :root { --bg: #f6f6f8; --card: #ffffff; --text: #16161a; --muted: #6b6b76; --accent: #6d4aff; --border: #e3e3ea; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0f0f12; --card: #1a1a20; --text: #f2f2f5; --muted: #9a9aa6; --accent: #8f73ff; --border: #2a2a33; } }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  main { max-width: 520px; margin: 0 auto; padding: 48px 16px; text-align: center; }
  img { width: 88px; height: 88px; border-radius: 20px; }
  h1 { font-size: 26px; margin: 16px 0 4px; }
  p { color: var(--muted); margin: 0 0 24px; }
  .url { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 12px; font: 15px ui-monospace, Menlo, monospace; margin-bottom: 20px; word-break: break-all; }
  .buttons { display: flex; flex-direction: column; gap: 10px; }
  a.button { display: block; padding: 13px; border-radius: 12px; background: var(--accent); color: #fff; text-decoration: none; font-weight: 600; }
  a.secondary { background: var(--card); color: var(--text); border: 1px solid var(--border); }
  footer { margin-top: 32px; font-size: 14px; color: var(--muted); }
  footer a { color: var(--accent); }
</style>
</head>
<body>
<main>
  <img src="CydiaIcon.png" alt="">
  <h1>RizzModz</h1>
  <p>RizzModz Mod Menu, RMz Framework and RMz Companion for jailbroken devices.</p>
  <div class="url">https://repo.rizzmodz.com/</div>
  <div class="buttons">
    <a class="button" href="sileo://source/https://repo.rizzmodz.com/">Add to Sileo</a>
    <a class="button secondary" href="zbra://sources/add/https://repo.rizzmodz.com/">Add to Zebra</a>
    <a class="button secondary" href="cydia://url/https://cydia.saurik.com/api/share#?source=https://repo.rizzmodz.com/">Add to Cydia</a>
  </div>
  <footer>Not jailbroken? Get the NJB inject zip from <a href="https://github.com/rizzmodzhq/rizzmodz-menu/releases">Releases</a>.</footer>
</main>
</body>
</html>
